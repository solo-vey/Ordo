contract_id: BL-ORDO-067
title: Full per-node AI interaction and decision debug trace
version: 1
status: design_only
runtime_semantics_changed: false
purpose: >-
  Define the observable, replayable record required for every decision-bearing
  node without persisting hidden chain-of-thought.
capture_levels:
  "off":
    stores: []
  standard:
    stores:
      - rendered_message
      - message_context_digest
      - analyst_response
      - selected_transition
      - applicable_rules
      - evidence_refs
      - state_refs
      - state_diff
      - replay_anchor
      - decision_summary
  diagnostic:
    extends: standard
    stores:
      - bounded_redacted_model_output_metadata
limits:
  rendered_message_chars: 12000
  analyst_response_chars: 12000
  decision_summary_chars: 4000
  evidence_refs_per_step: 64
required_observable_facts:
  - run_id
  - step_index
  - node_id
  - rendered_message
  - message_context_digest
  - analyst_response
  - selected_transition
  - applicable_rules
  - evidence_refs
  - state_before_ref
  - state_after_ref
  - state_diff
  - replay_anchor
required_hypothesis:
  - decision_summary
redaction:
  forbidden_fields:
    - chain_of_thought
    - hidden_chain_of_thought
    - private_reasoning
    - raw_system_prompt
    - raw_credentials
    - access_tokens
    - api_keys
  behavior:
    - redact_known_secret_patterns
    - truncate_to_contract_limits
    - preserve_digest_after_redaction
    - record_redaction_count
replay_anchor:
  required:
    - ir_hash
    - source_digest
    - node_id
    - step_index
    - prompt_context_digest
    - model_identity
    - generation_parameters_digest
  deterministic_replay: >-
    Replaying the same anchor must reproduce the same observable transition
    inputs and state references; a model explanation is not authoritative.
fact_hypothesis_boundary:
  facts:
    - rendered_message
    - analyst_response
    - selected_transition
    - applicable_rules
    - evidence_refs
    - state_refs
    - state_diff
    - replay_anchor
  hypothesis:
    - decision_summary
  rule: >-
    Consumers must never treat decision_summary as a replacement for the
    recorded question, answer, rules, evidence, transition, or state changes.
example:
  run_id: RUN-001
  step_index: 3
  node_id: N_CLASSIFY_INPUT
  rendered_message: "Classify the analyst response against the current rail."
  message_context_digest: sha256:example-message-context
  analyst_response: "The evidence is incomplete; return for clarification."
  selected_transition: N_CLARIFY
  applicable_rules: [G_EVIDENCE_COMPLETE, R_CLARIFY_ON_MISSING_EVIDENCE]
  evidence_refs: [runtime/evidence/step-003.json]
  state_before_ref: runtime/state_snapshots/SESSION-003-before.json
  state_after_ref: runtime/state_snapshots/SESSION-003-after.json
  state_diff: {clarification_required: [false, true]}
  replay_anchor:
    ir_hash: sha256:example-ir
    source_digest: sha256:example-source
    node_id: N_CLASSIFY_INPUT
    step_index: 3
    prompt_context_digest: sha256:example-prompt-context
    model_identity: provider/model@version
    generation_parameters_digest: sha256:example-generation-parameters
  decision_summary:
    text: "The response was routed to clarification because required evidence was absent."
    classification: hypothesis
    redacted: false
