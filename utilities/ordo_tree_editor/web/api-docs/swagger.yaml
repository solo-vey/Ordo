components:
  schemas:
    ApiResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          examples:
          - passed
          - failed
      additionalProperties: true
    ErrorResponse:
      type: object
      required:
      - status
      - error
      properties:
        status:
          const: failed
        error:
          type: string
      additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request or contract violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unknown endpoint/resource/run
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
