schema_version: '1.0'
pattern_id: PRODUCTION_PACKAGE_MATERIALIZATION
pattern_version: '1.1'
module_kind: reusable_data_layer_module_template
parameters:
  required:
  - instance_id
  optional:
  - artifact_id
  - prefix
required_roles:
- role: artifact
  binds_to: artifact
  required: true
- role: package_inputs
  binds_to: artifact_or_information
  required: true
- role: package_contract
  binds_to: information
  required: true
- role: closure_manifest
  binds_to: information
  required: true
- role: package_validation_status
  binds_to: information
  required: true
- role: delivery_evidence
  binds_to: information
  required: true
merge_semantics:
  mode: bind_existing_or_instantiate_missing
  canonical_truth: project_data_layer
  instance_catalog_required: true
  field_provenance_required: true
  pattern_instance_reference: pattern_id+pattern_version+instance_digest
  execution_ids_in_canonical_data_layer: forbidden
constraints:
- all_required_roles_bound
- bindings_resolve_to_project_data_layer
- no_parallel_semantic_truth
- pattern_version_and_digest_persisted
- requirement_origin_precedes_pattern_selection_for_reward
- no_execution_node_or_gate_ids_in_pattern_instance
module_objects:
- role: artifact
  kind: artifact
  required: true
- role: package_inputs
  kind: artifact_or_information
  required: true
- role: package_contract
  kind: information
  required: true
- role: closure_manifest
  kind: information
  required: true
- role: package_validation_status
  kind: information
  required: true
- role: delivery_evidence
  kind: information
  required: true
module_edges:
- from_role: package_inputs
  to_role: artifact
  type: packages
- from_role: package_contract
  to_role: artifact
  type: materializes
- from_role: closure_manifest
  to_role: artifact
  type: materializes
- from_role: package_validation_status
  to_role: artifact
  type: validated_by
- from_role: artifact
  to_role: delivery_evidence
  type: provided_by
