gate_contracts:
  code_source_gate:
    AVAILABLE: readable target repository/module source exists
    UNAVAILABLE: otherwise
  implementation_branch_gate:
    evaluator: exact_enum_outcome_dispatch
    outcome_field: implementation_branch_decision
    allowed_outcomes:
    - NO_LOCAL_CHANGE
    - HANDOFF_REQUIRED
    - LOCAL_SAFE
    NO_LOCAL_CHANGE: fresh mapping proves no local implementation obligation
    HANDOFF_REQUIRED: scope is shared, architectural, externally owned, or unresolved unsafe
    LOCAL_SAFE: all mutation obligations are locally owned and autonomy policy permits bounded change
    fail_closed_on:
    - missing outcome
    - unknown outcome
    - multiple outcomes
    binary_pass_fail_coercion: forbidden
  test_obligation_coverage_gate:
    PASS: every implemented obligation has explicit test/assertion or justified executable verification coverage
    FAIL: otherwise
  local_verification_gate:
    PASS: bound project verification evidence passes for the persisted patch and test state
    FAIL: failure, unavailable required verifier, or stale evidence
  result_archive_gate:
    PASS: archive is readable, non-empty, contains exactly required persisted changed files and passes integrity
      validation
    FAIL: otherwise
  verification_recovery_budget_gate:
    RETRY: failure is repairable and verification_recovery_attempt < max_verification_repair_attempts
    EXHAUSTED: repair is unsafe/unresolved or attempt budget is exhausted
    fail_closed: true
parameters:
  max_verification_repair_attempts:
    type: integer
    default: 2
    minimum: 0
    maximum: 5
    purpose: Maximum number of repair cycles after failed local verification before fail-closed handoff/block.
mutation_invalidation_contract:
  revision_role: implementation_revision_identity
  verification_role: local_verification_evidence
  mutation_roles:
  - apply_local_code_change
  - update_tests
  - update_documentation
  rules:
  - after any persisted mutation advance implementation_revision_identity
  - mark prior local_verification_evidence stale before continuing
  - PASS is valid only when evidence revision identity equals current implementation revision identity
presentation_contract:
  role: present_implementation_change_contract
  mandatory_before_local_mutation: true
  approval_semantics: informational_only_unless_host_adds_separate_explicit_authority_gate
  must_present: implementation_change_contract
recovery_contract:
  bounded: true
  attempt_counter: verification_recovery_state.attempt
  max_attempts_parameter: max_verification_repair_attempts
  failure_processing: diagnose_then_increment_before_budget_gate
  retry_target: plan_local_implementation
  exhausted_result: IMPLEMENTATION_VERIFICATION_BLOCKED
compiler_preflight_contract:
- YAML parses
- all executable IDs are unique
- all route targets resolve or are declared allowed external terminal targets
- every non-terminal executable element has at least one valid outgoing route
- every executable element is reachable from graph_contract.entry_node
- all canonical outcome destinations are preserved by the lowering
- multi-outcome semantic branches preserve exact canonical outcome tokens and fail closed on invalid discriminator
  state
- interactive nodes that continue execution use compiler-supported on_answer.next routing
- compiled graph passes the target editor/runtime-plan validator before delivery
