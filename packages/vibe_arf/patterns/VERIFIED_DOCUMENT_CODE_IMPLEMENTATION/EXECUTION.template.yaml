schema_version: '1.0'
pattern_id: VERIFIED_DOCUMENT_CODE_IMPLEMENTATION
pattern_version: '1.2'
facet_kind: execution_projection_template
source_of_truth: authoring/pattern_instance_catalog.yaml
projection_semantics:
  selection: forbidden_at_tree_stage
  derive_from_data_layer_instance: true
  role_to_node_binding_required: true
  provenance_required:
  - pattern_id
  - pattern_version
  - pattern_instance_id
  - instance_digest
  component_ids: deterministically_generated_from_pattern_instance_and_role
  canonical_data_layer_contains_execution_ids: false
  exact_graph_realization_required: true
  duplicate_component_ids_forbidden: true
  gate_outcome_edges_required: true
  multi_outcome_gate_lowering:
    mode: exact_enum_outcome_dispatch
    applies_to:
    - implementation_branch_gate
    requirements:
    - evaluate exactly one canonical outcome token
    - outcomes are mutually exclusive and collectively exhaustive for valid input state
    - do not coerce to PASS/FAIL
    - unknown, empty, or multiple outcomes fail closed
    - preserve all declared outcome destinations during lowering
  compiler_valid_lowering_required: true
  abstract_outcome_edges_are_not_compiled_routes: true
  compiled_route_contract:
    single_successor: next
    human_interaction: on_answer.next
    binary_gate: on_pass/on_fail
    multi_outcome: exact deterministic cascade gates over canonical discriminator tokens
    invalid_discriminator: fail_closed
    postcondition: all non-terminals routed; all executables reachable; all targets resolved
extension_contracts:
  document_to_requirements_adapter:
    required: true
    purpose: Translate the verified domain document into implementation obligations without inventing semantics.
  repository_architecture_adapter:
    required: true
    purpose: Define domain/repository-specific architecture evidence and inspection guidance. Repository evidence
      outranks assumptions.
  repository_scope_policy:
    required: true
    purpose: Map every material implementation obligation to local, shared/external, or unresolved repository ownership.
  autonomy_policy:
    required: true
    purpose: Define when local mutation is permitted. Shared, architectural, or unresolved ownership must not auto-mutate.
  test_obligation_policy:
    required: true
    purpose: Require explicit obligation-to-test/assertion coverage for every implemented obligation.
  verification_adapter:
    required: true
    purpose: Bind project-specific executable verification commands/evidence; absence of a runnable verifier must
      remain explicit and unverified.
  result_packaging_policy:
    required: true
    purpose: Select in-place completion or a validated result archive without packaging unrelated files.
  implementation_contract_presentation_adapter:
    required: true
    purpose: Render/present the implementation change contract before mutation. Presentation is informational and
      must not silently become an approval gate.
  verification_recovery_policy:
    required: true
    purpose: Classify verification failure evidence, define allowed bounded repair actions, and never convert missing/stale
      verification into PASS.
