schema_version: '1.0'
pattern_id: VERIFIED_DOCUMENT_JIRA_TASK_MATERIALIZATION
pattern_version: '1.1'
module_kind: reusable_data_layer_module_template
parameters:
  required:
  - instance_id
  optional:
  - artifact_id
  - prefix
required_roles:
- role: verified_document
  binds_to: artifact
  required: true
- role: verified_document_identity
  binds_to: information
  required: true
- role: testing_context
  binds_to: information
  required: true
- role: jira_task_contract
  binds_to: information
  required: true
- role: jira_task_content
  binds_to: artifact_or_information
  required: true
- role: jira_artifact_reference
  binds_to: artifact
  required: true
- role: jira_render_validation_status
  binds_to: information
  required: true
- role: jira_presentation_status
  binds_to: information
  required: true
merge_semantics:
  mode: bind_existing_or_instantiate_missing
  canonical_truth: project_data_layer
  instance_catalog_required: true
  field_provenance_required: true
  pattern_instance_reference: pattern_id+pattern_version+instance_digest
  execution_ids_in_canonical_data_layer: forbidden
constraints:
- all_required_roles_bound
- bindings_resolve_to_project_data_layer
- no_parallel_semantic_truth
- pattern_version_and_digest_persisted
- requirement_origin_precedes_pattern_selection_for_reward
- no_execution_node_or_gate_ids_in_pattern_instance
- verified_document_identity_is_immutable_input_boundary
- testing_context_is_runtime_supplied_or_explicitly_marked_not_provided
- testing_identifiers_are_never_invented
- jira_task_contract_is_derived_only_from_verified_document_testing_context_and_bound_adapters
- jira_task_content_is_a_compact_task_projection_not_a_full_document_copy
- jira_routing_metadata_is_bound_by_host_policy_or_left_explicitly_unset_never_invented
- jira_artifact_must_pass_render_validation_before_presentation
module_objects:
- role: verified_document
  kind: artifact
  required: true
- role: verified_document_identity
  kind: information
  required: true
- role: testing_context
  kind: information
  required: true
- role: jira_task_contract
  kind: information
  required: true
- role: jira_task_content
  kind: artifact_or_information
  required: true
- role: jira_artifact_reference
  kind: artifact
  required: true
- role: jira_render_validation_status
  kind: information
  required: true
- role: jira_presentation_status
  kind: information
  required: true
module_edges:
- from_role: verified_document
  to_role: jira_task_contract
  type: derived_from
- from_role: verified_document_identity
  to_role: jira_task_contract
  type: constrains
- from_role: testing_context
  to_role: jira_task_contract
  type: augments
- from_role: jira_task_contract
  to_role: jira_task_content
  type: materializes
- from_role: jira_task_content
  to_role: jira_artifact_reference
  type: materializes
- from_role: jira_artifact_reference
  to_role: jira_render_validation_status
  type: validated_by
- from_role: jira_render_validation_status
  to_role: jira_presentation_status
  type: constrains
