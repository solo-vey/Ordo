schema_version: '1.0'
pattern_id: VERIFIED_DOCUMENT_JIRA_TASK_MATERIALIZATION
pattern_version: '1.1'
facet_kind: execution_projection_template
source_of_truth: authoring/pattern_instance_catalog.yaml
projection_semantics:
  selection: forbidden_at_tree_stage
  derive_from_data_layer_instance: true
  role_to_node_binding_required: true
  provenance_required:
  - pattern_id
  - pattern_version
  - pattern_instance_id
  - instance_digest
  component_ids: deterministically_generated_from_instance_id_and_role
  compiler_valid_lowering_required: true
  abstract_outcome_edges_are_not_compiled_routes: true
  compiled_route_contract:
    single_successor: next
    human_interaction: on_answer.next
    binary_gate: on_pass/on_fail
    multi_outcome: exact deterministic cascade gates over canonical discriminator tokens
    invalid_discriminator: fail_closed
    postcondition: all non-terminals routed; all executables reachable; all targets resolved
required_responsibilities:
- role: request_testing_context
  kind: node
  responsibility_class: human_interaction
- role: derive_jira_task_contract
  kind: node
  responsibility_class: contract_classified
- role: compose_jira_task_content
  kind: node
  responsibility_class: model_assisted
- role: materialize_jira_artifact
  kind: node
  responsibility_class: deterministic
- role: validate_jira_artifact
  kind: gate
  responsibility_class: deterministic
- role: present_jira_task
  kind: node
  responsibility_class: model_assisted
- role: finalize_jira_task_projection
  kind: node
  responsibility_class: deterministic
outcome_edges:
- from_role: request_testing_context
  outcome: PROVIDED
  to_role: derive_jira_task_contract
- from_role: request_testing_context
  outcome: NOT_PROVIDED
  to_role: derive_jira_task_contract
- from_role: derive_jira_task_contract
  outcome: DONE
  to_role: compose_jira_task_content
- from_role: compose_jira_task_content
  outcome: DONE
  to_role: materialize_jira_artifact
- from_role: materialize_jira_artifact
  outcome: DONE
  to_role: validate_jira_artifact
- from_role: validate_jira_artifact
  outcome: PASS
  to_role: present_jira_task
- from_role: validate_jira_artifact
  outcome: REPAIR
  to_role: compose_jira_task_content
- from_role: present_jira_task
  outcome: PRESENTED
  to_role: finalize_jira_task_projection
gate_contracts:
  validate_jira_artifact:
    PASS: materialized Jira artifact is readable, non-empty, contains the required task-contract sections and introduces
      no invented testing identifiers or routing metadata
    REPAIR: otherwise
    fail_closed: true
task_projection_contract:
  purpose: Reduce a large verified document into a compact implementation-oriented Jira task without copying the
    full document.
  required_semantic_sections:
  - task_summary
  - implementation_goal
  - source_references_if_present
  - technical_requirements
  - testing_context
  - acceptance_and_verification
  transfer_rules:
  - include only requirements supported by the verified document
  - include only source links or references actually present in supplied materials
  - testing_context may contain identifiers, fixtures, accounts, environments, scenarios, or other runtime information
    supplied for implementation testing
  - when testing context is not supplied, use an explicit not-provided marker rather than inventing values
  - Jira routing/work-planning metadata is host-bound; the generic pattern must not invent project, component, assignee,
    sprint, estimates, labels, priority, parent, or similar fields
presentation_contract:
  role: present_jira_task
  requires_validation_pass: true
  approval_semantics: informational_only
compiler_preflight_contract:
- YAML parses
- all executable IDs are unique
- all route targets resolve or are declared allowed external terminal targets
- every non-terminal executable element has at least one valid outgoing route
- every executable element is reachable from graph_contract.entry_node
- all canonical outcome destinations are preserved by the lowering
- multi-outcome semantic branches preserve exact canonical outcome tokens and fail closed on invalid discriminator
  state
- interactive nodes that continue execution use compiler-supported on_answer.next routing
- compiled graph passes the target editor/runtime-plan validator before delivery
