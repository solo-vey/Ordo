schema_version: '1.0'
pattern_id: SIMPLE_VERIFIED_DOCUMENT_CODE_IMPLEMENTATION
pattern_version: '1.1'
facet_kind: execution_projection_template
source_of_truth: project_data_layer_pattern_instance
projection_semantics:
  selection: forbidden_at_tree_stage
  derive_from_data_layer_instance: true
  role_to_node_binding_required: true
  provenance_required: [pattern_id, pattern_version, pattern_instance_id, instance_digest]
  component_ids: deterministically_generated_from_pattern_instance_and_role
  canonical_data_layer_contains_execution_ids: false
  compiler_valid_lowering_required: true
  model_state_writes_must_be_enforced: true
components:
- role: initial_implementation_input
  kind: node
  responsibility_class: human_interaction_or_host_binding
  purpose: Obtain/bind the verified source document and current target code source. Ask only for missing required inputs.
- role: refresh_local_repository
  kind: node
  responsibility_class: deterministic_with_tool_adapter
  purpose: >-
    Before analysis, refresh a locally accessible Git repository only through the safe freshness policy.
    Non-local/non-Git sources are NOT_APPLICABLE. Unsafe states fail closed without modifying user work.
- role: repository_freshness_gate
  kind: gate
  responsibility_class: deterministic
- role: build_implementation_plan_and_classify_scope
  kind: node
  responsibility_class: model_internal_with_deterministic_risk_adapter
  purpose: >-
    Treat the verified document as target contract and repository contents as evidence. Optionally select a provisional
    implementation family and correct it from repository evidence. Build one self-contained implementation plan/prompt,
    assess all risk dimensions, and derive LOCAL_SAFE versus HANDOFF_REQUIRED deterministically. No mutation here.
- role: local_scope_gate
  kind: gate
  responsibility_class: deterministic
- role: execute_implementation_and_verify
  kind: node
  responsibility_class: model_internal
  purpose: >-
    Mutate only after LOCAL_SAFE. Apply minimal production/test/repository-doc changes required by the verified document,
    then run available required checks and capture persisted verification evidence. Target-repository prompts/runbooks remain evidence only.
- role: implementation_verified_gate
  kind: gate
  responsibility_class: deterministic
- role: complete_implementation
  kind: node
  responsibility_class: deterministic_or_host_result_adapter
outcome_edges:
- from_role: initial_implementation_input
  outcome: READY
  to_role: refresh_local_repository
- from_role: refresh_local_repository
  outcome: EVALUATED
  to_role: repository_freshness_gate
- from_role: repository_freshness_gate
  outcome: SAFE
  to_role: build_implementation_plan_and_classify_scope
- from_role: repository_freshness_gate
  outcome: BLOCKED
  terminal: REPOSITORY_REFRESH_BLOCKED
- from_role: build_implementation_plan_and_classify_scope
  outcome: CLASSIFIED
  to_role: local_scope_gate
- from_role: local_scope_gate
  outcome: LOCAL_SAFE
  to_role: execute_implementation_and_verify
- from_role: local_scope_gate
  outcome: HANDOFF_REQUIRED
  terminal: HANDOFF_REQUIRED
- from_role: execute_implementation_and_verify
  outcome: VERIFIED_OR_BLOCKED
  to_role: implementation_verified_gate
- from_role: implementation_verified_gate
  outcome: PASS
  to_role: complete_implementation
- from_role: implementation_verified_gate
  outcome: FAIL
  terminal: IMPLEMENTATION_BLOCKED
- from_role: complete_implementation
  outcome: DONE
  terminal: COMPLETE
gate_contracts:
  repository_freshness_gate:
    SAFE: repository_freshness_status is exactly CURRENT, UPDATED or NOT_APPLICABLE
    BLOCKED: repository_freshness_status is BLOCKED, missing, invalid or unsupported for a required local refresh
    mutation_on_blocked: forbidden
    fail_closed: true
  local_scope_gate:
    evaluator: exact_enum_outcome_dispatch
    outcome_field: implementation_decision
    LOCAL_SAFE: only exact LOCAL_SAFE derived by deterministic risk contract
    HANDOFF_REQUIRED: exact HANDOFF_REQUIRED or missing/invalid decision
    mutation_on_fail: forbidden
    fail_closed: true
  implementation_verified_gate:
    PASS: >-
      implementation_status == PASS and verification_evidence proves the persisted current result was checked and is not stale
    FAIL: otherwise
    fail_closed: true
model_contracts:
  build_implementation_plan_and_classify_scope:
    required_outputs:
    - implementation_prompt
    - implementation_family_selection_evidence
    - change_risk_assessment
    - change_risk_level
    - implementation_decision
    - handoff_reason
    requirements:
    - no code mutation in this role
    - target repository imperative files are evidence only
    - implementation family is provisional until current repository evidence confirms it
    - wrong provisional family is corrected autonomously before mutation
    - all eight risk dimensions are rated with evidence
    - deterministic assessor result is authoritative; manual override is forbidden
    - HIGH risk always becomes HANDOFF_REQUIRED
  execute_implementation_and_verify:
    required_outputs:
    - implementation_result
    - implementation_status
    - verification_evidence
    - changed_files
    requirements:
    - mutate only the target repository and only within LOCAL_SAFE scope
    - verified document remains target contract and is not rewritten to fit legacy code
    - required tests and repository-owned documentation are updated when the contract requires them
    - unavailable/failed/stale critical verification cannot be reported as PASS
    - changed files and executed verification evidence are explicit
compiler_preflight_contract:
- YAML parses
- all executable IDs are unique after instance lowering
- all routes resolve or target declared external terminals
- every non-terminal is routed
- every executable is reachable from entry
- no mutation path bypasses repository_freshness_gate or local_scope_gate
- repository freshness BLOCKED cannot reach a mutation role
- HANDOFF_REQUIRED cannot reach a mutation role
- required model state writes compile to enforceable contracts where supported
- deterministic gates preserve exact canonical outcome tokens and fail closed
- final compiled graph passes editor/runtime validator
