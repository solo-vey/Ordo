ordo:
  package_version: 0.0.1
  execution_mode: chat_internal
  control_level: guided
graph_contract:
  entry_node: N1
  external_terminal_targets:
  - END
nodes:
- id: N1
  type: human_decision
  answer_type: enum
  allowed_answers:
  - 'yes'
  - 'no'
  on_answer:
    'yes':
      update_state:
        decision: $answer.value
      next: END
    'no':
      next: END
gates: []
outputs: []
