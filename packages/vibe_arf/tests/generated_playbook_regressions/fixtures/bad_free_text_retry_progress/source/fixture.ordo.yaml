ordo:
  package_version: 0.0.1
  execution_mode: chat_internal
  control_level: guided
graph_contract:
  entry_node: H
  external_terminal_targets:
  - END
nodes:
- id: H
  type: human_decision
  answer_type: free_text
  on_answer:
    next: G
gates:
- id: G
  condition: state.x == PASS
  on_pass: END
  on_fail: H
outputs: []
