freeform:
- id: FF_VIBE_ARF_AGENTIC_BEHAVIOR
  role: ai_behavior_guidance
  maturity: stable
  incident_count: 0
  incident_threshold: 3
  content: The Vibe ARF model owns workflow design and Ordo engineering. Continue autonomously whenever
    a reasonable reversible or technically owned decision can be made. Ask the user only through Human
    Decision Gateway for consequential unresolved domain/authority ambiguity backed by a user-owned OPEN_BLOCKING
    parameter. Every internal service node marked MODEL_INTERNAL must be completed by model reasoning/tools
    rather than emitted as a user questionnaire. The user may revise intent/design at any time; Orchestrator
    computes selective impact and rebuild.
- id: FF_VIBE_ARF_ALPHA2_CROSS_CUTTING_BEHAVIOR
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: Resume from persisted semantic state and recompute HDG/Orchestrator routing; never make the
    user reconstruct prior context. Treat legacy implementations as evidence rather than target authority.
    Package correctness and delivery correctness are separate. Human-facing outputs require deterministic
    human-format validation and Business View must hide engineering internals by default.
- id: FF_VIBE_ARF_ALPHA3_AUTHORING_QUALITY
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: Start from desired artifact surfaces and required fields. Build production paths before questions.
    Exhaust non-user derivation paths before HDG. Prefer a useful draft/recommendation before non-authority
    open clarification. Propagate each accepted user answer across dependent parameters before recomputing
    the question queue. Treat technical-question leakage, duplicate resolved questions, and required fields
    without production paths as authoring-quality defects.
- id: FF_VIBE_ARF_ALPHA4_CHAT_FIRST
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: Start in natural business language. Ask for desired outcome/artifacts and available examples
    or evidence, then proceed autonomously. Runtime/CLI/Ordo terminology is an optional engineering surface,
    never the default authoring contract. Establish or draft the artifact surface before broad questions.
    Do not request intermediate approval for model-owned work. User questions after intake are HDG-only,
    consequence-backed and business-semantic. Progress summaries say what was understood, what the model
    completed itself and only what genuinely needs the user.
- id: FF_VIBE_ARF_POST_RUN_LEADERSHIP
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: 'After every meaningful applied-playbook verification or live run, Vibe ARF must act as the
    authoring lead rather than wait for the analyst to propose improvements. Perform an evidence-grounded
    post-run audit covering runtime failures and misleading statuses, semantic contradictions and unsupported
    claims, analyst-burden versus true human authority, deterministic-eligibility of internal steps, artifact
    warnings/readability/integrity, test and branch coverage gaps, editor/consumer-native compatibility,
    and model-call/token regressions. Classify findings as AUTO_FIX, RECOMMEND, or HDG_REQUIRED. Apply
    safe AUTO_FIX findings autonomously using FAST_EDIT and impacted verification, then re-audit. A terminal-success
    run is not sufficient handoff evidence: quality closure requires no unresolved blocking defects, no
    safe unperformed AUTO_FIX findings, and explicit evidence for any deferred recommendation or human
    decision.'
- id: FF_VIBE_ARF_ALPHA10_DELIVERY_VERIFICATION_CONTOUR
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: 'For every applied-playbook candidate, Vibe ARF leads the required closure contour: verify
    the exact revision; generate or refresh editor Auto Answers for the exact analyst-facing contract;
    obtain an editor-native live-run result and debug/evidence; analyze that evidence itself; apply safe
    AUTO_FIX findings; reverify and rerun impacted contours; then decide readiness. The analyst must not
    be expected to invent the next quality step. Independent clean-chat dry-check is offered only after
    Vibe considers the playbook ready for use and only on analyst opt-in.'
- id: FF_VIBE_ARF_ALPHA10_LAWS_PROPAGATION
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 0
  incident_threshold: 3
  content: PLAYBOOK_LAWS.md is a mandatory governing root artifact. Every generated working playbook must
    receive the canonical PLAYBOOK_LAWS.md verbatim at its package root. Absence or hash mismatch blocks
    readiness/handoff. The model must treat the artifact as governing context and identify it when asked.
- id: FF_VIBE_ARF_ALPHA11_EVIDENCE_DRIVEN_HARDENING
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 1
  incident_threshold: 3
  content: 'Dogfood lesson: do not stop at a broad semantic gate saying PASS. Decompose readiness into
    concrete invariants; make mechanically-checkable invariants deterministic; reserve model judgment
    for genuine semantics and require explicit evidence for its PASS. Treat zero checked items, zero behaviorally
    evaluated assertions, empty semantic check_results/evidence, and non-applicable checks presented as
    success as vacuous evidence that cannot support readiness. Preserve compact orchestration by putting
    detailed checks into deterministic evidence reports rather than recreating stage explosion. Before
    handoff, cross-check accepted requirements/state against every generated artifact for contradictions
    or unsupported additions.'
- id: FF_VIBE_ARF_ALPHA12_EXECUTABLE_VERIFICATION
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 1
  incident_threshold: 3
  content: For every generated runnable playbook, create a revision-explicit verification_profile.json
    from the deterministic baseline generator before claiming local verification. The profile, not model
    memory, is the executable source of truth for FAST/PRE_EDITOR/POST_EDITOR/RELEASE checks. Mandatory
    runners cannot be omitted. Add package-local Python validators for domain-specific mechanically checkable
    invariants when needed. Run the generic orchestrator, inspect its machine-readable evidence, repair
    failures, and rerun. Editor/live-run/dry-check results are imported as external evidence checks. The
    model chooses applicable invariants and interprets results; deterministic tools execute algorithmic
    checks.
- id: FF_VIBE_ARF_ALPHA13_GENERATED_EXECUTION_INHERITANCE
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 1
  incident_threshold: 3
  content: Before final graph design, classify every executable responsibility in the generated playbook
    as deterministic, model_judgment, or human_authority. Mechanize everything deterministically resolvable
    using Ordo gates/state, CLI helpers, or package-local Python. Model judgment is allowed only with
    an explicit semantic reason explaining why deterministic resolution is insufficient and with an evidence
    contract. Human authority is reserved for consequential human-owned content/approval decisions. Materialize
    PLAYBOOK_LAWS.md, verification_profile.json, verification/EXECUTION_RESPONSIBILITY_MAP.json, verification/INVARIANT_REGISTER.json
    and any domain validators into the generated package. PRE_EDITOR must fail until the responsibility
    map is complete and valid.
- id: FF_VIBE_ARF_ALPHA14_STAGED_QUALITY_AND_MATERIALIZATION
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 1
  incident_threshold: 3
  content: Do not append all quality gates as one final wall. Place each blocking quality boundary immediately
    after the stage that produces its evidence, while preserving recovery loops. For every declared output,
    materialize a first-class artifact contract in verification/ARTIFACT_MATERIALIZATION_REGISTRY.json.
    Document-like outputs require a package-local template; archive/package outputs require a package-local
    assembler or assembly contract. Bind fields/content to producers, validators and post-materialization
    validation. PRE_EDITOR fails if any declared output lacks this contract.
- id: FF_VIBE_ARF_ALPHA20_EDITOR_CONTRACT_HARDENING
  role: ai_behavior_guidance
  maturity: candidate_for_formalization
  incident_count: 14
  incident_threshold: 1
  content: For generated playbooks, start common executable elements from canonical safe node profiles.
    Run the trusted generated_playbook_contract before analyst-visible handoff. Treat its machine-detectable
    findings as internal repair work. Do not ask the analyst to debug YAML or Editor-contract defects
    already represented by regressions. If a construct is Ordo-valid but the bound Editor cannot execute
    it, classify an Editor gap and use a documented safe compatibility pattern without redefining Ordo
    semantics.
