process_rail:
  rail_id: ORDO_VIBE_ARF_RAIL
  purpose: Information-first, artifact-backwards playbook authoring with autonomous service routing and
    HDG-only human escalation.
  state_tracking: required
  allow_deviation: true
  require_resume_after_deviation: true
  backtracking: enabled
graph_contract:
  entry_node: N_VIBE_INTAKE
  bidirectional_transition_policy: explicit_source_and_target
  incoming_edge_field: allowed_from
  duplicate_transition_policy: reject_same_scope_duplicates
  external_terminal_targets:
  - END_PLAYBOOK_PACKAGE_ACCEPTED
  allowed_cycle_regions:
  - id: VIBE_AUTHORING_LIFECYCLE
