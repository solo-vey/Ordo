      next_node: explicit
  description: Data-Layer-first reusable pattern discovery; no tree synthesis or tree-level selection.
- id: N_U_PATTERN_FIT_RESOLUTION
  question: Resolve only ambiguous/partial pattern matches using artifact semantics and authority constraints.
    Exact-fit canonical patterns must remain selected unless a recorded incompatibility proves they cannot
    satisfy the Data Layer contract. For no-fit responsibilities, record explicit ad-hoc justification.
    This decision still belongs to Data Layer design, not tree synthesis.
  answer_type: structured_record
  on_answer:
    update_state:
      pattern_fit_resolution: $answer.pattern_fit_resolution
    next: N_U_PATTERN_DATA_LAYER_INSTANTIATION
  allowed_from:
