    - capability_requirement_catalog
    - artifact_surface_inventory
    knowledge_refs:
    - authoring/artifact_catalog.yaml
    - authoring/capability_requirement_catalog.yaml
    - tools/freeze_pattern_selection_inputs.py
    allowed_tools:
    - validate-state
    output_contract:
      state_diff: required
      next_node: explicit
  description: Deterministic pre-library requirement snapshot for applicability and anti-gaming.
- id: N_U_PATTERN_APPLICABILITY_DISCOVERY
  question: Deterministically discover reusable Data+Execution patterns from `patterns/PATTERN_REGISTRY.json`
    using the already-declared artifact surface and `authoring/capability_requirement_catalog.yaml`. Exact
    fits are mandatory auto-candidates; partial fits are surfaced for semantic resolution; no-fit remains
    explicit. Capability requirements must not be invented from library contents. Do not design Ordo nodes
    here.
  answer_type: structured_record
  on_answer:
    update_state:
      reusable_pattern_library: $answer.reusable_pattern_library
      pattern_applicability_result: $answer.pattern_applicability_result
      pattern_discovery_result: $answer.pattern_applicability_result
    next: N_U_PATTERN_FIT_RESOLUTION
  allowed_from:
  - N_U_PATTERN_SELECTION_INPUT_FREEZE
  allow_unmatched_input: true
  node_context:
    version: '1.0'
    interaction_class: MODEL_INTERNAL
    user_question_allowed: false
    autonomous_resolution_required: true
    required_state:
