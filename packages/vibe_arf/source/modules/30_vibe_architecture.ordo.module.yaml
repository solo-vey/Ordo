- id: N_U_PATTERN_DATA_LAYER_INSTANTIATION
  question: Deterministically instantiate selected pattern Data-Layer modules. Bind required semantic
    roles to existing project information/artifact IDs or declare deterministic missing-role IDs for subsequent
    Data-Layer completion. Persist only pattern id/version, semantic bindings, requirement origin, extensions
    and instance digest in `authoring/pattern_instance_catalog.yaml`; concrete node/gate IDs are forbidden
    here. Materialize `authoring/pattern_data_layer_expansion.yaml` from the selected DATA_LAYER templates
    and merge its required objects/edges into subsequent project Data-Layer authoring.
  answer_type: structured_record
  on_answer:
    update_state:
      pattern_instance_catalog: $answer.pattern_instance_catalog
    next: N_VERIFY_PATTERN_DATA_LAYER_INSTANCE
