nodes:
- id: N_VIBE_INTAKE
  question: Describe in your own words what the future playbook must do and which outputs you need. Add
    example results, templates, input documents, or legacy instructions when available. The system will
    design the process and ask you only for a decision that belongs to you.
  answer_type: free_text
  on_answer:
    update_state:
      raw_user_intent: $answer
      latest_user_input: $answer
    next: N_U_ANALYST_CONTEXT_CAPTURE
  allowed_from: []
  node_context:
    version: '1.0'
    interaction_class: USER_FACING
    user_question_allowed: true
    required_state:
    - current_node
    knowledge_refs:
    - vibe_arf_authoring_model
    - parameter_ledger
    allowed_tools: []
    output_contract:
      state_diff: required
      next_node: explicit
  description: 'Primary Vibe entry. Collect natural intent without technical questionnaire. Existing playbooks/instructions
    are accepted as migration evidence; a resumed session reconstructs context from persisted state rather
    than asking the user to restate it. Automatically inventory provided desired artifacts, templates,
    examples and legacy output surfaces before asking for structured requirements. Chat-first default:
    no CLI/runtime/Ordo terminology is required from the user. Analyst input may arrive all-at-once, incrementally,
    reordered, or wider than the current question; generated playbook design must preserve all relevant
    supported facts without forcing schema-shaped answers.'
  on_unmatched_input:
    action: CLARIFY.REQUEST
    strategy: rephrase_minimally_and_preserve_context
    max_attempts: 2
    on_exhausted:
      action: escalate_to_human
      reason: required user-owned blocker remains unresolved
  entry_modes:
  - root
- id: N_U_ANALYST_CONTEXT_CAPTURE
  question: 'Execute this node''s declared responsibility exactly. Preserve the declared state, evidence,
    authority, tool, output, and transition contracts. Responsibility: Atomic responsibility: classify
    and persist durable analyst context for future editing/evaluation.'
  answer_type: structured_record
  on_answer:
    update_state:
      analyst_context_catalog: $answer.context_catalog
      analyst_context_capture_status: $answer.status
      analyst_context_refresh_required_ids: $answer.refresh_required_ids
    next: N_U_SOURCE_ASSIMILATION
  allowed_from:
  - N_VIBE_INTAKE
  - N_C_ROUTE_PLAN
  - N_DESIGN_READINESS
  - N_FEEDBACK_CLASSIFY
  - N_HDG_QUESTION
  - N_REVIEW_ROUTING
  allow_unmatched_input: true
  node_context:
    version: '1.0'
    interaction_class: MODEL_INTERNAL
    user_question_allowed: false
    autonomous_resolution_required: true
    required_state:
    - current_node
    knowledge_refs:
    - source/analyst-context-preservation-policy.json
    - analyst_context/context_catalog.json
    allowed_tools:
    - tools/capture_analyst_context.py
    - tools/validate_analyst_context.py
    output_contract:
      state_diff: required
      next_node: explicit
    responsibility_id: n_u_analyst_context_capture
  description: 'Atomic responsibility: classify and persist durable analyst context for future editing/evaluation.'
