- id: N_VERIFY_PATTERN_DATA_LAYER_INSTANCE
  question: Deterministically validate selected pattern instances before detailed Data-Layer completion.
    Check pattern/version/digest provenance, required semantic-role bindings, requirement-origin evidence,
    extension policy and absence of concrete node/gate IDs. Materialize/validate `authoring/pattern_data_layer_expansion.yaml`.
