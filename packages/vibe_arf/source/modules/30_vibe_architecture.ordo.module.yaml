    version: '1.0'
    interaction_class: MODEL_INTERNAL
    user_question_allowed: false
    autonomous_resolution_required: true
    required_state:
    - current_node
    - artifact_surface_inventory
    knowledge_refs:
    - authoring/artifact_catalog.yaml
    - source/data-layer-first-hard-architecture-policy.json
    allowed_tools: []
    output_contract:
      state_diff: required
      next_node: explicit
  description: Early Data-Layer capability requirements, intentionally classified before library lookup.
- id: N_U_PATTERN_SELECTION_INPUT_FREEZE
  question: Deterministically freeze the pre-library artifact and capability requirements into `authoring/pattern_selection_input_snapshot.json`
    before any pattern lookup. The snapshot is hash-bound and becomes the only eligibility basis for automatic
    reuse scoring; later pattern-created artifacts/capabilities cannot earn reuse rewards in the same
    design pass.
  answer_type: structured_record
  on_answer:
    update_state:
      pattern_selection_input_snapshot: $answer.pattern_selection_input_snapshot
    next: N_U_PATTERN_APPLICABILITY_DISCOVERY
  allowed_from:
