- id: N_U_CAPABILITY_REQUIREMENT_CATALOG
  question: Before consulting the reusable pattern library, classify the project capabilities required
    by the business goal, artifact surface, rules, authority and delivery contract. Materialize `authoring/capability_requirement_catalog.yaml`
    with stable requirement IDs, capability tags, related artifacts when applicable, requiredness and
    requirement_origin. Do not inspect pattern availability while deciding whether a capability is genuinely
    required; this prevents reward-driven invention of fake requirements.
  answer_type: structured_record
  on_answer:
    update_state:
      capability_requirement_catalog: $answer.capability_requirement_catalog
    next: N_U_PATTERN_SELECTION_INPUT_FREEZE
