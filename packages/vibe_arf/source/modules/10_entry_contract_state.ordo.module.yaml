interaction_model:
  human_role: domain_owner_analyst_customer
  ai_role: autonomous_ordo_playbook_engineer
  proactive_ai_behavior: required
  yaml_visibility_policy: hidden_by_default
  business_view_default: true
  ask_user_only_through_hdg: true
intent:
  id: INTENT_VIBE_ARF
  description: 'Create or refine a rigorous Ordo playbook from natural-language intent,
    source materials and desired output artifacts while minimizing user cognitive
    load. The AI owns workflow design, Ordo engineering, verification, repair, packaging
    and incremental change impact; the user supplies domain intent/authority only
    when a consequential ambiguity cannot be resolved autonomously. The authoring
    session is resumable from persisted state, supports legacy-process migration,
    validates human-facing format, and treats delivery/handoff as a separate lifecycle
    from package correctness. Authoring is information-first: artifacts are decomposed
    into a validated information-flow model before process graph synthesis; required
    output fields and parameter production paths are derived before user questioning,
    and legitimate user answers propagate across dependent parameters. Default authoring
    is chat-first: natural intent and desired artifacts first, autonomous engineering
    until a consequential user-owned blocker.'
